version: "3.8"

services:
  # Frontend
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    depends_on:
      - api
    networks:
      - public
      - internal

  # Backend API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://hydraclip:hydraclip@postgres:5432/hydraclip
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=localhost:9002
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=hydraclip
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_CREATOR_PRICE_ID=${STRIPE_CREATOR_PRICE_ID}
      - STRIPE_PRO_PRICE_ID=${STRIPE_PRO_PRICE_ID}
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET}
      - YOUTUBE_REDIRECT_URI=${YOUTUBE_REDIRECT_URI}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - PIPER_MODEL_PATH=/models/piper
      - WHISPER_MODEL_SIZE=tiny
      - APP_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      - postgres
      - redis
      - minio
      - ollama
    networks:
      - public
      - internal

  # Remotion render service (turns structured input props into an MP4)
  renderer:
    build:
      context: ./apps/renderer
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - REMOTION_BUNDLE_DIR=/app/build
      - REMOTION_COMPOSITION_ID=HydraClipShort
      - REMOTION_LICENSE_KEY=${REMOTION_LICENSE_KEY:-free-license}
      - REMOTION_IS_PRODUCTION=${REMOTION_IS_PRODUCTION:-false}
      - RENDER_CONCURRENCY=${RENDER_CONCURRENCY:-1}
      - RENDER_TABS=${RENDER_TABS:-4}
    ports:
      - "3002:3001"
    networks:
      - internal

  # Celery Worker
  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://hydraclip:hydraclip@postgres:5432/hydraclip
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=hydraclip
      - SECRET_KEY=${SECRET_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - PIPER_MODEL_PATH=/models/piper
      - WHISPER_MODEL_SIZE=tiny
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openrouter/auto}
      - RENDERER_URL=http://renderer:3001
      - RENDER_TIMEOUT_SECONDS=${RENDER_TIMEOUT_SECONDS:-1800}
      - APP_URL=http://localhost:3000
    depends_on:
      - postgres
      - redis
      - minio
      - ollama
      - renderer
    networks:
      - internal

  # Celery Beat
  beat:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    command: celery -A celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://hydraclip:hydraclip@postgres:5432/hydraclip
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=hydraclip
      - SECRET_KEY=${SECRET_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - PIPER_MODEL_PATH=/models/piper
      - WHISPER_MODEL_SIZE=tiny
    depends_on:
      - postgres
      - redis
      - minio
      - ollama
    networks:
      - internal

  # Flower (Celery monitoring)
  flower:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    command: celery -A celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - internal

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=hydraclip
      - POSTGRES_PASSWORD=hydraclip
      - POSTGRES_DB=hydraclip
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - internal

  # Redis
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - internal

  # MinIO
  minio:
    image: chrislusf/seaweedfs:3.80
    command: server -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3_config.json -filer -filer.port=9001 -master.port=9333 -volume.port=8080
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - seaweed_data:/data
      - ./apps/seaweed/s3_config.json:/etc/seaweedfs/s3_config.json:ro
    networks:
      - internal
      - public

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11435:11434"
    networks:
      - internal

volumes:
  seaweed_data:
  postgres_data:
  redis_data:
  minio_data:
  ollama_models:

networks:
  public:
  internal:
