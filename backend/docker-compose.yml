services:
  # Optional local database. Hosted deployments (for example Supabase) use
  # DATABASE_URL and do not start this profile.
  postgres:
    profiles: ["local-db"]
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: hydraclip
      POSTGRES_USER: hydraclip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydraclip"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Object storage is intentionally external. MinIO stopped publishing its
  # official container images, and hosted S3/Supabase deployments should not
  # pull or wait for a local object store. Use STORAGE_BACKEND=local for local
  # renders, or configure the S3_* settings for a real bucket.

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      # The Dockerfile COPYs `apps/` and `seed.py`, which live here, not in
      # apps/api. With `build: ./apps/api` the context was apps/api itself and
      # every COPY resolved to a non-existent path.
      context: .
      dockerfile: apps/api/Dockerfile
    # Anchored so worker and beat inherit exactly the same configuration;
    # a worker with different settings to the API is a classic source of
    # "works in the API, fails in the job" bugs.
    environment: &api_env
      # Honour an external DATABASE_URL (for example Supabase's IPv4 session
      # pooler). Previously this was hard-coded to the bundled Postgres service,
      # so a correct DATABASE_URL in .env was silently ignored by Docker.
      - DATABASE_URL=${DATABASE_URL:-postgresql://hydraclip:${POSTGRES_PASSWORD:-secret}@postgres:5432/hydraclip}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Object storage for finished renders. Without STORAGE_BACKEND=s3 the
      # MP4 only ever exists on the worker's disk, which Instagram and
      # TikTok cannot fetch from.
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      # Internal/upload endpoint and credentials. Resolve the preferred S3_*
      # names (plus Supabase's bucket spelling) before legacy MINIO_* aliases.
      # No object store is bundled: official MinIO images are no longer
      # published, and hosted S3/Supabase deployments do not need one.
      - MINIO_ENDPOINT=${S3_ENDPOINT:-${MINIO_ENDPOINT:-}}
      - MINIO_ACCESS_KEY=${S3_ACCESS_KEY:-${MINIO_ACCESS_KEY:-}}
      - MINIO_SECRET_KEY=${S3_SECRET_KEY:-${MINIO_SECRET_KEY:-}}
      - MINIO_BUCKET=${S3_BUCKET:-${SUPABASE_STORAGE_BUCKET:-${MINIO_BUCKET:-hydraclip}}}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      # External HTTPS address used to sign URLs that Instagram and TikTok
      # can fetch. For Supabase this is normally the same as S3_ENDPOINT.
      - MEDIA_PUBLIC_BASE_URL=${MEDIA_PUBLIC_BASE_URL:-}
      - MEDIA_URL_EXPIRY_SECONDS=${MEDIA_URL_EXPIRY_SECONDS:-86400}
      # Keep the scratch render after upload. Off by default; the bucket is
      # the source of truth once the upload succeeds.
      - MEDIA_RETAIN_LOCAL=${MEDIA_RETAIN_LOCAL:-false}
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production}
      # Keep this separate from SECRET_KEY so rotating JWT credentials does
      # not make every encrypted social-account token unreadable.
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-}
      - ACCESS_TOKEN_EXPIRES_IN=${ACCESS_TOKEN_EXPIRES_IN:-3600}
      - REFRESH_TOKEN_EXPIRES_IN=${REFRESH_TOKEN_EXPIRES_IN:-86400}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-adminpass}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - PIPER_MODEL_PATH=${PIPER_MODEL_PATH:-/models/piper}
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-base}
      # Stock footage. At least one of these is required for the assemble
      # stage; they are tried in STOCK_PROVIDER_ORDER. Shutterstock is last
      # because its previews are watermarked comps.
      - PEXELS_API_KEY=${PEXELS_API_KEY:-}
      - PIXABAY_API_KEY=${PIXABAY_API_KEY:-}
      - UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY:-}
      - SHUTTERSTOCK_API_TOKEN=${SHUTTERSTOCK_API_TOKEN:-}
      - STOCK_PROVIDER_ORDER=${STOCK_PROVIDER_ORDER:-pexels,pixabay,unsplash,shutterstock}
      # Render output. Vertical by default, matching the platforms the
      # publishing stage targets.
      - VIDEO_WIDTH=${VIDEO_WIDTH:-1080}
      - VIDEO_HEIGHT=${VIDEO_HEIGHT:-1920}
      - VIDEO_FPS=${VIDEO_FPS:-30}
      - SUBTITLES_ENABLED=${SUBTITLES_ENABLED:-true}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # Social OAuth values must be explicitly forwarded: Compose uses .env
      # for interpolation, but does not otherwise inject every .env key into
      # the container.
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID:-}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET:-}
      - YOUTUBE_REDIRECT_URI=${YOUTUBE_REDIRECT_URI:-}
      - INSTAGRAM_CLIENT_ID=${INSTAGRAM_CLIENT_ID:-}
      - INSTAGRAM_CLIENT_SECRET=${INSTAGRAM_CLIENT_SECRET:-}
      - INSTAGRAM_REDIRECT_URI=${INSTAGRAM_REDIRECT_URI:-}
      - TIKTOK_CLIENT_ID=${TIKTOK_CLIENT_ID:-}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET:-}
      - TIKTOK_REDIRECT_URI=${TIKTOK_REDIRECT_URI:-}
      - X_CLIENT_ID=${X_CLIENT_ID:-}
      - X_CLIENT_SECRET=${X_CLIENT_SECRET:-}
      - X_REDIRECT_URI=${X_REDIRECT_URI:-}
      # Dispatch generation to the worker fleet rather than running it inside
      # the API process.
      - JOB_RUNNER=${JOB_RUNNER:-celery}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - MEDIA_WORK_DIR=${MEDIA_WORK_DIR:-/tmp/hydraclip}
      - JOB_TIMEOUT_SECONDS=${JOB_TIMEOUT_SECONDS:-900}
    depends_on:
      # Redis is the only bundled runtime dependency. DATABASE_URL and S3_*
      # may point at hosted services and must not force local containers.
      redis:
        condition: service_healthy
    volumes:
      # Piper voice models, kept out of the image because they are ~60MB
      # each and swappable. Download one into ./models/piper; the URLs are
      # in apps/api/Dockerfile. Without it the voiceover and assemble
      # stages correctly report themselves unavailable.
      - ./models/piper:/models/piper:ro
      # Renders are written here. A shared volume means the API can serve a
      # file the worker produced; without it they each see their own /tmp.
      - media_work:/tmp/hydraclip
    ports:
      - "8000:8000"

  # Worker and beat run the API image with a different command: identical
  # code and dependencies, built once. The original service was removed in an
  # earlier pass because its name contained a "/" (illegal in Compose), it
  # built ./apps/worker which did not exist, and it published 5555, colliding
  # with flower.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: >
      celery -A apps.worker.celery_app:celery_app worker
      --loglevel=info
      --concurrency=${WORKER_CONCURRENCY:-2}
      -Q generation,maintenance
    environment: *api_env
    volumes:
      # The worker is what actually renders, so it needs both the voice
      # model and the shared scratch space.
      - ./models/piper:/models/piper:ro
      - media_work:/tmp/hydraclip
    depends_on:
      # Redis is the only bundled runtime dependency. DATABASE_URL and S3_*
      # may point at hosted services and must not force local containers.
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A apps.worker.celery_app:celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

  beat:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # --schedule must live on a writable path; the image runs as non-root.
    command: >
      celery -A apps.worker.celery_app:celery_app beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    environment: *api_env
    depends_on:
      redis:
        condition: service_healthy


  # Optional queue-monitoring dashboard. The old celery/flower repository no
  # longer exists; mher/flower is the image documented by Flower itself.
  # Keeping it behind a profile means monitoring can never block the core app.
  flower:
    profiles: ["monitoring"]
    image: mher/flower:2.2.0
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    ports:
      - "5555:5555"

volumes:
  postgres_data:
  media_work:
  ollama_models:
