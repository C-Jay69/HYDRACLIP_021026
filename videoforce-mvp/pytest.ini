[pytest]
# Make `apps.api.*` importable without installing the project.
pythonpath = .
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
# Coroutine tests are plain `async def`; no per-test marker needed.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:passlib.*
